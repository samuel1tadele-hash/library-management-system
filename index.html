    return `
      <div class="surface surface-hover rounded-xl p-5 relative overflow-hidden transition-colors">
        <div class="absolute -top-8 -right-8 w-24 h-24 rounded-full bg-gradient-to-br ${gradient} to-transparent blur-2xl"></div>
        <div class="relative">
          <div class="text-[11px] font-mono uppercase tracking-wider text-stone-500">${U.esc(label)}</div>
          <div class="text-2xl font-semibold text-stone-50 mt-3 tracking-tight">${value}</div>
        </div>
      </div>
    `;
  },

  circulation() {
    const canIssue = Auth.can('loans.issue');
    const canReturn = Auth.can('loans.return');

    const activeLoans = DB.all(`
      SELECT l.id, l.loan_date, l.due_date, l.status,
        CAST(julianday('now') - julianday(l.due_date) AS INTEGER) AS days_overdue,
        b.title AS book_title, b.isbn,
        m.first_name, m.last_name, m.member_id
      FROM loans l
      JOIN books b ON l.book_id = b.id
      JOIN members m ON l.member_id = m.id
      WHERE l.status IN ('active', 'overdue')
      ORDER BY l.due_date ASC
    `);

    return `
      <div class="mb-8">
        <h1 class="text-2xl font-semibold tracking-tight">Circulation Desk</h1>
        <p class="text-sm text-stone-500 mt-1">Issue new loans and process returns</p>
      </div>

      <div class="grid lg:grid-cols-2 gap-4 mb-8">
        ${canIssue ? `
          <div class="surface rounded-xl p-6">
            <div class="flex items-center gap-3 mb-5">
              <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-accent to-[#8b7cff] flex items-center justify-center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#08090a" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </div>
              <div>
                <h2 class="text-base font-medium">Issue a book</h2>
                <p class="text-[11px] text-stone-500 font-mono">Loan period: ${RULES.LOAN_DAYS} days</p>
              </div>
            </div>
            <form id="issueForm" class="space-y-3">
              <div>
                <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Book</label>
                <select name="book" id="issueBookSelect" required class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2.5 text-sm text-stone-100 outline-none">
                  <option value="">Select a book…</option>
                  ${DB.all(`
                    SELECT b.id, b.title, b.author, b.available_copies, b.total_copies
                    FROM books b
                    ORDER BY b.title
                  `).map(b => `
                    <option value="${b.id}" ${b.available_copies === 0 ? 'disabled' : ''}>
                      ${U.esc(b.title)} — ${U.esc(b.author)} (${b.available_copies}/${b.total_copies} available)
                    </option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Member</label>
                <select name="member" id="issueMemberSelect" required class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2.5 text-sm text-stone-100 outline-none">
                  <option value="">Select a member…</option>
                  ${DB.all(`
                    SELECT m.id, m.member_id, m.first_name, m.last_name, m.status,
                      (SELECT COUNT(*) FROM loans WHERE member_id = m.id AND status IN ('active','overdue')) AS active_loans,
                      (SELECT COALESCE(SUM(fine_amount),0) FROM loans WHERE member_id = m.id AND fine_paid = 0) AS unpaid
                    FROM members m WHERE m.status = 'active' ORDER BY m.last_name
                  `).map(m => `
                    <option value="${m.id}">
                      ${U.esc(m.first_name)} ${U.esc(m.last_name)} — ${U.esc(m.member_id)} · ${m.active_loans}/${RULES.MAX_LOANS_PER_MEMBER} loans${m.unpaid > 0 ? ` · ${U.currency(m.unpaid)} owed` : ''}
                    </option>
                  `).join('')}
                </select>
              </div>
              <button type="submit" class="w-full bg-white hover:bg-stone-200 text-black font-medium py-2.5 rounded-lg text-sm transition-colors">Issue book</button>
            </form>
          </div>
        ` : `
          <div class="surface rounded-xl p-6 opacity-60">
            <p class="text-sm text-stone-500">Read-only — sign in as librarian or admin to issue books</p>
          </div>
        `}

        <div class="surface rounded-xl p-6">
          <div class="flex items-center gap-3 mb-5">
            <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l2 2 4-4"/><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/></svg>
            </div>
            <div>
              <h2 class="text-base font-medium">Quick return</h2>
              <p class="text-[11px] text-stone-500 font-mono">${activeLoans.length} active loans</p>
            </div>
          </div>
          <p class="text-[12px] text-stone-500 leading-relaxed mb-4">
            Click <strong class="text-stone-300">Return</strong> on any loan below. Overdue fines are calculated automatically at ${U.currency(RULES.FINE_PER_DAY)}/day.
          </p>
          <div class="max-h-[340px] overflow-y-auto -mx-2 px-2 space-y-1.5">
            ${activeLoans.length === 0 ? '<p class="text-xs text-stone-500 text-center py-6">No active loans</p>' :
              activeLoans.map(l => `
                <div class="flex items-center justify-between gap-3 py-2.5 px-3 rounded-lg hover:bg-white/[0.02] transition-colors">
                  <div class="min-w-0 flex-1">
                    <div class="text-[13px] text-stone-100 truncate">${U.esc(l.book_title)}</div>
                    <div class="text-[11px] text-stone-500 font-mono truncate">
                      ${U.esc(l.first_name)} ${U.esc(l.last_name)}
                      ${l.days_overdue > 0
                        ? `<span class="text-red-400 ml-1">· ${l.days_overdue}d overdue (${U.currency(l.days_overdue * RULES.FINE_PER_DAY)})</span>`
                        : `· due ${U.date(l.due_date)}`}
                    </div>
                  </div>
                  ${canReturn ? `
                    <button data-return="${l.id}" class="shrink-0 text-[11px] font-medium bg-white/[0.06] hover:bg-white text-stone-200 hover:text-black px-3 py-1.5 rounded-md transition-colors">Return</button>
                  ` : ''}
                </div>
              `).join('')}
          </div>
        </div>
      </div>

      <div class="surface rounded-xl p-6">
        <h3 class="text-sm font-medium text-stone-200 mb-3">Business rules enforced at the database level</h3>
        <div class="grid sm:grid-cols-2 gap-3 text-xs text-stone-500">
          <div class="flex items-start gap-2.5">
            <span class="text-accent-soft mt-0.5">·</span>
            <span>Loan period: <strong class="text-stone-300">${RULES.LOAN_DAYS} days</strong></span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-accent-soft mt-0.5">·</span>
            <span>Fine rate: <strong class="text-stone-300">${U.currency(RULES.FINE_PER_DAY)}/day overdue</strong></span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-accent-soft mt-0.5">·</span>
            <span>Max loans per member: <strong class="text-stone-300">${RULES.MAX_LOANS_PER_MEMBER}</strong></span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-accent-soft mt-0.5">·</span>
            <span>Suspension at <strong class="text-stone-300">${RULES.SUSPEND_OVERDUE_COUNT} overdue</strong> or <strong class="text-stone-300">${U.currency(RULES.SUSPEND_FINE_THRESHOLD)} unpaid</strong></span>
          </div>
        </div>
      </div>
    `;
  },

  catalog() {
    const search = this._catSearch || '';
    const catFilter = this._catCategory || 'all';

    const where = [], params = [];
    if (search) {
      where.push('(b.title LIKE ? OR b.author LIKE ? OR b.isbn LIKE ?)');
      const q = `%${search}%`; params.push(q, q, q);
    }
    if (catFilter !== 'all') { where.push('b.category_id = ?'); params.push(catFilter); }
    const whereSql = where.length ? 'WHERE ' + where.join(' AND ') : '';

    const books = DB.all(`
      SELECT b.*, c.name AS category_name, c.code AS category_code,
        (SELECT COUNT(*) FROM loans WHERE book_id = b.id AND status IN ('active','overdue')) AS on_loan
      FROM books b
      JOIN categories c ON b.category_id = c.id
      ${whereSql}
      ORDER BY b.title
    `, params);

    const cats = DB.all('SELECT * FROM categories ORDER BY name');
    const canCreate = Auth.can('books.create');

    return `
      <div class="flex items-end justify-between mb-8 gap-4 flex-wrap">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Catalog</h1>
          <p class="text-sm text-stone-500 mt-1">${books.length} ${books.length === 1 ? 'title' : 'titles'}</p>
        </div>
        ${canCreate ? `
          <button id="newBookBtn" class="inline-flex items-center gap-2 bg-white hover:bg-stone-200 text-black font-medium px-4 py-2 rounded-lg text-sm transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add book
          </button>
        ` : ''}
      </div>

      <div class="surface rounded-xl p-4 mb-4 flex flex-wrap gap-3">
        <div class="flex-1 min-w-[200px] relative">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500">
            <circle cx="11" cy="11" r="7"/><path d="M4 20l6-6"/>
          </svg>
          <input id="catSearch" type="text" placeholder="Search by title, author, ISBN…" value="${U.esc(search)}"
            class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg pl-9 pr-3 py-2 text-sm text-stone-100 outline-none">
        </div>
        <select id="catCategory" class="bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
          <option value="all" ${catFilter === 'all' ? 'selected' : ''}>All categories</option>
          ${cats.map(c => `<option value="${c.id}" ${catFilter == c.id ? 'selected' : ''}>${U.esc(c.name)}</option>`).join('')}
        </select>
      </div>

      ${books.length === 0 ? UI.empty('No books found', 'Try clearing your search or filters.') : `
        <div class="surface rounded-xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-[11px] font-mono uppercase tracking-wider text-stone-500">
                <tr class="border-b border-white/[0.06]">
                  <th class="text-left px-5 py-3 font-normal">Title</th>
                  <th class="text-left px-5 py-3 font-normal">Author</th>
                  <th class="text-left px-5 py-3 font-normal">Category</th>
                  <th class="text-right px-5 py-3 font-normal">Copies</th>
                  <th class="text-left px-5 py-3 font-normal">Shelf</th>
                  <th class="text-right px-5 py-3 font-normal">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${books.map(b => {
                  const available = b.available_copies;
                  const total = b.total_copies;
                  return `
                    <tr class="border-b border-white/[0.04] last:border-0 hover:bg-white/[0.015] transition-colors">
                      <td class="px-5 py-3">
                        <div class="text-stone-100">${U.esc(b.title)}</div>
                        <div class="text-[11px] text-stone-500 font-mono">${U.esc(b.isbn)}</div>
                      </td>
                      <td class="px-5 py-3 text-stone-300 text-[13px]">${U.esc(b.author)}</td>
                      <td class="px-5 py-3">
                        <span class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-white/[0.04] text-stone-400">${U.esc(b.category_code)}</span>
                      </td>
                      <td class="px-5 py-3 text-right font-mono text-xs">
                        <span class="${available === 0 ? 'text-red-400' : available === total ? 'text-stone-300' : 'text-accent-soft'}">
                          ${available} / ${total}
                        </span>
                      </td>
                      <td class="px-5 py-3 text-stone-500 font-mono text-xs">${U.esc(b.shelf || '—')}</td>
                      <td class="px-5 py-3 text-right">
                        <div class="inline-flex gap-1">
                          ${Auth.can('books.edit') ? `
                            <button data-edit-book="${b.id}" class="w-7 h-7 rounded-md text-stone-500 hover:text-stone-100 hover:bg-white/[0.06] flex items-center justify-center transition-colors" title="Edit">
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>
                            </button>
                          ` : ''}
                          ${Auth.can('books.delete') && b.on_loan === 0 ? `
                            <button data-del-book="${b.id}" class="w-7 h-7 rounded-md text-stone-500 hover:text-red-400 hover:bg-red-500/10 flex items-center justify-center transition-colors" title="Delete">
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                            </button>
                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `}
    `;
  },

  members() {
    const members = DB.all(`
      SELECT m.*,
        (SELECT COUNT(*) FROM loans WHERE member_id = m.id AND status IN ('active','overdue')) AS active_loans,
        (SELECT COUNT(*) FROM loans WHERE member_id = m.id AND status = 'overdue') AS overdue,
        (SELECT COALESCE(SUM(fine_amount),0) FROM loans WHERE member_id = m.id AND fine_paid = 0) AS unpaid
      FROM members m
      ORDER BY m.last_name, m.first_name
    `);
    const canCreate = Auth.can('members.create');

    return `
      <div class="flex items-end justify-between mb-8 gap-4 flex-wrap">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Members</h1>
          <p class="text-sm text-stone-500 mt-1">${members.length} registered members</p>
        </div>
        ${canCreate ? `
          <button id="newMemberBtn" class="inline-flex items-center gap-2 bg-white hover:bg-stone-200 text-black font-medium px-4 py-2 rounded-lg text-sm transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Register member
          </button>
        ` : ''}
      </div>

      <div class="surface rounded-xl overflow-hidden">
        <table class="w-full text-sm">
          <thead class="text-[11px] font-mono uppercase tracking-wider text-stone-500">
            <tr class="border-b border-white/[0.06]">
              <th class="text-left px-5 py-3 font-normal">Member</th>
              <th class="text-left px-5 py-3 font-normal">Contact</th>
              <th class="text-left px-5 py-3 font-normal">Joined</th>
              <th class="text-right px-5 py-3 font-normal">Loans</th>
              <th class="text-right px-5 py-3 font-normal">Fines</th>
              <th class="text-left px-5 py-3 font-normal">Status</th>
              <th class="text-right px-5 py-3 font-normal">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${members.map(m => `
              <tr class="border-b border-white/[0.04] last:border-0 hover:bg-white/[0.015] transition-colors">
                <td class="px-5 py-3">
                  <div class="text-stone-100">${U.esc(m.first_name)} ${U.esc(m.last_name)}</div>
                  <div class="text-[11px] text-stone-500 font-mono">${U.esc(m.member_id)}</div>
                </td>
                <td class="px-5 py-3">
                  <div class="text-stone-300 text-[12px]">${U.esc(m.email)}</div>
                  <div class="text-[11px] text-stone-500 font-mono">${U.esc(m.phone || '—')}</div>
                </td>
                <td class="px-5 py-3 text-stone-400 text-xs whitespace-nowrap">${U.date(m.join_date)}</td>
                <td class="px-5 py-3 text-right font-mono text-xs">
                  <span class="${m.active_loans >= RULES.MAX_LOANS_PER_MEMBER ? 'text-amber-400' : 'text-stone-300'}">
                    ${m.active_loans}${m.overdue > 0 ? ` <span class="text-red-400">(${m.overdue} overdue)</span>` : ''}
                  </span>
                </td>
                <td class="px-5 py-3 text-right font-mono text-xs ${m.unpaid > 0 ? 'text-amber-300' : 'text-stone-500'}">
                  ${m.unpaid > 0 ? U.currency(m.unpaid) : '—'}
                </td>
                <td class="px-5 py-3">${UI.statusBadge(m.status)}</td>
                <td class="px-5 py-3 text-right">
                  <div class="inline-flex gap-1">
                    ${Auth.can('members.edit') ? `
                      <button data-edit-member="${m.id}" class="w-7 h-7 rounded-md text-stone-500 hover:text-stone-100 hover:bg-white/[0.06] flex items-center justify-center transition-colors" title="Edit">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>
                      </button>
                    ` : ''}
                    ${Auth.can('members.delete') && m.active_loans === 0 ? `
                      <button data-del-member="${m.id}" class="w-7 h-7 rounded-md text-stone-500 hover:text-red-400 hover:bg-red-500/10 flex items-center justify-center transition-colors" title="Delete">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                      </button>
                    ` : ''}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  loans() {
    const filter = this._loanFilter || 'active';
    let where = '';
    if (filter === 'active') where = "WHERE l.status IN ('active','overdue')";
    else if (filter === 'overdue') where = "WHERE l.status = 'overdue'";
    else if (filter === 'returned') where = "WHERE l.status = 'returned'";

    const loans = DB.all(`
      SELECT l.*, b.title AS book_title, b.isbn, m.first_name, m.last_name, m.member_id,
        CAST(julianday('now') - julianday(l.due_date) AS INTEGER) AS days_overdue
      FROM loans l
      JOIN books b ON l.book_id = b.id
      JOIN members m ON l.member_id = m.id
      ${where}
      ORDER BY l.loan_date DESC
    `);

    const counts = DB.one(`
      SELECT
        (SELECT COUNT(*) FROM loans WHERE status IN ('active','overdue')) AS active,
        (SELECT COUNT(*) FROM loans WHERE status = 'overdue') AS overdue,
        (SELECT COUNT(*) FROM loans WHERE status = 'returned') AS returned,
        (SELECT COUNT(*) FROM loans) AS all_count
    `);

    return `
      <div class="flex items-end justify-between mb-8 gap-4 flex-wrap">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Loans</h1>
          <p class="text-sm text-stone-500 mt-1">Complete loan history</p>
        </div>
      </div>

      <div class="flex gap-1 mb-5 border-b border-white/[0.06]">
        ${this._loanTab('active', `Active (${counts.active})`, filter)}
        ${this._loanTab('overdue', `Overdue (${counts.overdue})`, filter)}
        ${this._loanTab('returned', `Returned (${counts.returned})`, filter)}
        ${this._loanTab('all', `All (${counts.all_count})`, filter)}
      </div>

      ${loans.length === 0 ? UI.empty('No loans in this view') : `
        <div class="surface rounded-xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-[11px] font-mono uppercase tracking-wider text-stone-500">
                <tr class="border-b border-white/[0.06]">
                  <th class="text-left px-5 py-3 font-normal">Book</th>
                  <th class="text-left px-5 py-3 font-normal">Member</th>
                  <th class="text-left px-5 py-3 font-normal">Loan date</th>
                  <th class="text-left px-5 py-3 font-normal">Due date</th>
                  <th class="text-left px-5 py-3 font-normal">Returned</th>
                  <th class="text-right px-5 py-3 font-normal">Fine</th>
                  <th class="text-left px-5 py-3 font-normal">Status</th>
                  <th class="text-right px-5 py-3 font-normal">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${loans.map(l => {
                  const fine = l.fine_amount || (l.days_overdue > 0 && l.status === 'overdue' ? l.days_overdue * RULES.FINE_PER_DAY : 0);
                  return `
                    <tr class="border-b border-white/[0.04] last:border-0 hover:bg-white/[0.015] transition-colors">
                      <td class="px-5 py-3">
                        <div class="text-stone-100 text-[13px]">${U.esc(l.book_title)}</div>
                        <div class="text-[11px] text-stone-500 font-mono">${U.esc(l.isbn)}</div>
                      </td>
                      <td class="px-5 py-3">
                        <div class="text-stone-200 text-[13px]">${U.esc(l.first_name)} ${U.esc(l.last_name)}</div>
                        <div class="text-[11px] text-stone-500 font-mono">${U.esc(l.member_id)}</div>
                      </td>
                      <td class="px-5 py-3 text-stone-400 text-xs font-mono whitespace-nowrap">${U.date(l.loan_date)}</td>
                      <td class="px-5 py-3 text-stone-400 text-xs font-mono whitespace-nowrap ${l.status === 'overdue' ? 'text-red-400' : ''}">
                        ${U.date(l.due_date)}
                        ${l.days_overdue > 0 && l.status === 'overdue' ? `<span class="ml-1 text-[10px]">(+${l.days_overdue}d)</span>` : ''}
                      </td>
                      <td class="px-5 py-3 text-stone-400 text-xs font-mono whitespace-nowrap">${U.date(l.return_date)}</td>
                      <td class="px-5 py-3 text-right font-mono text-xs ${fine > 0 ? (l.fine_paid ? 'text-emerald-400' : 'text-amber-300') : 'text-stone-500'}">
                        ${fine > 0 ? U.currency(fine) : '—'}
                        ${fine > 0 && !l.fine_paid ? '<div class="text-[10px] text-red-400">unpaid</div>' : ''}
                        ${fine > 0 && l.fine_paid ? '<div class="text-[10px] text-emerald-400">paid</div>' : ''}
                      </td>
                      <td class="px-5 py-3">${UI.statusBadge(l.status)}</td>
                      <td class="px-5 py-3 text-right">
                        <div class="inline-flex gap-1">
                          ${Auth.can('loans.return') && l.status !== 'returned' ? `
                            <button data-return="${l.id}" class="text-[11px] text-stone-400 hover:text-emerald-300 px-2.5 py-1 rounded-md hover:bg-emerald-500/10 transition-colors">Return</button>
                          ` : ''}
                          ${Auth.can('loans.renew') && l.status === 'active' && l.days_overdue <= 0 ? `
                            <button data-renew="${l.id}" class="text-[11px] text-stone-400 hover:text-accent-soft px-2.5 py-1 rounded-md hover:bg-accent/[0.08] transition-colors">Renew</button>
                          ` : ''}
                          ${Auth.can('fines.pay') && l.fine_amount > 0 && !l.fine_paid ? `
                            <button data-pay-fine="${l.id}" class="text-[11px] text-amber-300 hover:text-amber-200 px-2.5 py-1 rounded-md hover:bg-amber-500/10 transition-colors">Pay fine</button>
                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `}
    `;
  },

  _loanTab(id, label, active) {
    return `<button data-loan-filter="${id}" class="px-4 py-2.5 text-[13px] font-medium transition-colors border-b-2 ${
      active === id ? 'text-stone-100 border-accent' : 'text-stone-500 border-transparent hover:text-stone-300'
    }">${label}</button>`;
  },

  reservations() {
    const pending = DB.all(`
      SELECT r.*, b.title AS book_title, b.available_copies,
        m.first_name, m.last_name, m.member_id,
        CAST(julianday('now') - julianday(r.reserved_at) AS INTEGER) AS days_waiting
      FROM reservations r
      JOIN books b ON r.book_id = b.id
      JOIN members m ON r.member_id = m.id
      WHERE r.status = 'pending'
      ORDER BY r.reserved_at ASC
    `);

    const history = DB.all(`
      SELECT r.*, b.title AS book_title,
        m.first_name, m.last_name
      FROM reservations r
      JOIN books b ON r.book_id = b.id
      JOIN members m ON r.member_id = m.id
      WHERE r.status != 'pending'
      ORDER BY r.reserved_at DESC LIMIT 20
    `);

    const byBook = {};
    pending.forEach(r => {
      if (!byBook[r.book_id]) byBook[r.book_id] = { title: r.book_title, available: r.available_copies, queue: [] };
      byBook[r.book_id].queue.push(r);
    });

    return `
      <div class="flex items-end justify-between mb-8 gap-4 flex-wrap">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Reservations</h1>
          <p class="text-sm text-stone-500 mt-1">${pending.length} pending across ${Object.keys(byBook).length} titles</p>
        </div>
      </div>

      ${Object.keys(byBook).length === 0 ? UI.empty('No pending reservations', 'Books with all copies on loan can be reserved from the Catalog view.') : `
        <div class="space-y-4">
          ${Object.values(byBook).map(b => `
            <div class="surface rounded-xl p-5">
              <div class="flex items-center justify-between mb-4 pb-4 border-b border-white/[0.05]">
                <div>
                  <h3 class="text-stone-100 font-medium">${U.esc(b.title)}</h3>
                  <div class="text-[11px] text-stone-500 font-mono mt-1">
                    ${b.queue.length} in queue · ${b.available > 0 ? `<span class="text-emerald-400">${b.available} available now</span>` : '<span class="text-red-400">all copies on loan</span>'}
                  </div>
                </div>
              </div>
              <div class="space-y-2">
                ${b.queue.map((r, i) => `
                  <div class="flex items-center justify-between py-2">
                    <div class="flex items-center gap-3">
                      <div class="w-6 h-6 rounded-md bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-[10px] font-mono text-stone-400">
                        ${i + 1}
                      </div>
                      <div>
                        <div class="text-[13px] text-stone-200">${U.esc(r.first_name)} ${U.esc(r.last_name)}</div>
                        <div class="text-[11px] text-stone-500 font-mono">${U.esc(r.member_id)} · waiting ${r.days_waiting}d</div>
                      </div>
                    </div>
                    ${Auth.can('reservations.cancel') ? `
                      <button data-cancel-res="${r.id}" class="text-[11px] text-stone-500 hover:text-red-400 px-2.5 py-1 rounded-md hover:bg-red-500/10 transition-colors">Cancel</button>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `}

      ${history.length > 0 ? `
        <div class="surface rounded-xl overflow-hidden mt-6">
          <div class="p-5 border-b border-white/[0.06]">
            <h2 class="text-sm font-medium text-stone-200">Recent reservation history</h2>
          </div>
          <div class="divide-y divide-white/[0.04]">
            ${history.map(h => `
              <div class="px-5 py-3 flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <div class="text-[13px] text-stone-200 truncate">${U.esc(h.book_title)}</div>
                  <div class="text-[11px] text-stone-500 font-mono truncate">${U.esc(h.first_name)} ${U.esc(h.last_name)} · ${U.date(h.reserved_at)}</div>
                </div>
                ${UI.statusBadge(h.status)}
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    `;
  },

  reports() {
    const tab = this._reportsTab || 'overdue';
    let content = '';

    if (tab === 'overdue') {
      const rows = DB.all(`
        SELECT l.id, l.due_date,
          b.title, b.isbn,
          m.first_name, m.last_name, m.email,
          CAST(julianday('now') - julianday(l.due_date) AS INTEGER) AS days_overdue,
          CAST(julianday('now') - julianday(l.due_date) AS INTEGER) * ${RULES.FINE_PER_DAY} AS fine
        FROM loans l
        JOIN books b ON l.book_id = b.id
        JOIN members m ON l.member_id = m.id
        WHERE l.status = 'overdue'
        ORDER BY days_overdue DESC
      `);
      const total = rows.reduce((s, r) => s + r.fine, 0);

      content = rows.length === 0 ? UI.empty('No overdue books', 'Great job — everyone is on time.') : `
        <div class="grid grid-cols-3 gap-3 mb-5">
          <div class="surface rounded-lg p-4">
            <div class="text-[10px] font-mono uppercase tracking-widest text-stone-500">Overdue loans</div>
            <div class="text-2xl font-semibold mt-2 text-red-400">${rows.length}</div>
          </div>
          <div class="surface rounded-lg p-4">
            <div class="text-[10px] font-mono uppercase tracking-widest text-stone-500">Total fines</div>
            <div class="text-2xl font-semibold mt-2 text-amber-300">${U.currency(total)}</div>
          </div>
          <div class="surface rounded-lg p-4">
            <div class="text-[10px] font-mono uppercase tracking-widest text-stone-500">Avg overdue</div>
            <div class="text-2xl font-semibold mt-2 text-stone-200">${Math.round(rows.reduce((s, r) => s + r.days_overdue, 0) / rows.length)}d</div>
          </div>
        </div>
        <div class="surface rounded-xl overflow-hidden">
          <table class="w-full text-sm">
            <thead class="text-[11px] font-mono uppercase tracking-wider text-stone-500">
              <tr class="border-b border-white/[0.06]">
                <th class="text-left px-5 py-3 font-normal">Book</th>
                <th class="text-left px-5 py-3 font-normal">Member</th>
                <th class="text-left px-5 py-3 font-normal">Due date</th>
                <th class="text-right px-5 py-3 font-normal">Days</th>
                <th class="text-right px-5 py-3 font-normal">Fine</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="border-b border-white/[0.04] last:border-0">
                  <td class="px-5 py-3">
                    <div class="text-stone-100 text-[13px]">${U.esc(r.title)}</div>
                    <div class="text-[11px] text-stone-500 font-mono">${U.esc(r.isbn)}</div>
                  </td>
                  <td class="px-5 py-3">
                    <div class="text-stone-200 text-[13px]">${U.esc(r.first_name)} ${U.esc(r.last_name)}</div>
                    <div class="text-[11px] text-stone-500 font-mono">${U.esc(r.email)}</div>
                  </td>
                  <td class="px-5 py-3 text-stone-400 text-xs font-mono">${U.date(r.due_date)}</td>
                  <td class="px-5 py-3 text-right font-mono text-xs text-red-400">${r.days_overdue}</td>
                  <td class="px-5 py-3 text-right font-mono text-xs text-amber-300">${U.currency(r.fine)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } else if (tab === 'popular') {
      const rows = DB.all(`
        SELECT b.title, b.author, c.name AS category,
          COUNT(l.id) AS total_loans,
          SUM(CASE WHEN l.status = 'returned' THEN 1 ELSE 0 END) AS returned,
          SUM(CASE WHEN l.status IN ('active','overdue') THEN 1 ELSE 0 END) AS out
        FROM books b
        JOIN categories c ON b.category_id = c.id
        LEFT JOIN loans l ON l.book_id = b.id
        GROUP BY b.id
        HAVING total_loans > 0
        ORDER BY total_loans DESC
        LIMIT 20
      `);
      const max = Math.max(...rows.map(r => r.total_loans), 1);

      content = rows.length === 0 ? UI.empty('No loan history yet') : `
        <div class="surface rounded-xl p-6">
          <div class="space-y-4">
            ${rows.map(r => `
              <div>
                <div class="flex justify-between text-xs mb-1.5">
                  <div>
                    <span class="text-stone-200">${U.esc(r.title)}</span>
                    <span class="text-stone-500 ml-2 font-mono">${U.esc(r.author)}</span>
                  </div>
                  <span class="text-stone-400 font-mono shrink-0 ml-3">${r.total_loans} loans</span>
                </div>
                <div class="h-1.5 bg-white/[0.04] rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-accent to-[#8b7cff] rounded-full" style="width:${(r.total_loans/max)*100}%"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else if (tab === 'members') {
      const rows = DB.all(`
        SELECT m.member_id, m.first_name, m.last_name, m.status,
          COUNT(l.id) AS total_loans,
          SUM(CASE WHEN l.status = 'returned' THEN 1 ELSE 0 END) AS returned,
          SUM(CASE WHEN l.status IN ('active','overdue') THEN 1 ELSE 0 END) AS active,
          COALESCE(SUM(CASE WHEN l.fine_paid = 0 THEN l.fine_amount ELSE 0 END), 0) AS owed
        FROM members m
        LEFT JOIN loans l ON l.member_id = m.id
        GROUP BY m.id
        HAVING total_loans > 0
        ORDER BY total_loans DESC
      `);
      content = rows.length === 0 ? UI.empty('No member activity yet') : `
        <div class="surface rounded-xl overflow-hidden">
          <table class="w-full text-sm">
            <thead class="text-[11px] font-mono uppercase tracking-wider text-stone-500">
              <tr class="border-b border-white/[0.06]">
                <th class="text-left px-5 py-3 font-normal">Member</th>
                <th class="text-right px-5 py-3 font-normal">Total loans</th>
                <th class="text-right px-5 py-3 font-normal">Returned</th>
                <th class="text-right px-5 py-3 font-normal">Active</th>
                <th class="text-right px-5 py-3 font-normal">Unpaid</th>
                <th class="text-left px-5 py-3 font-normal">Status</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="border-b border-white/[0.04] last:border-0">
                  <td class="px-5 py-3">
                    <div class="text-stone-100 text-[13px]">${U.esc(r.first_name)} ${U.esc(r.last_name)}</div>
                    <div class="text-[11px] text-stone-500 font-mono">${U.esc(r.member_id)}</div>
                  </td>
                  <td class="px-5 py-3 text-right font-mono text-xs text-stone-200">${r.total_loans}</td>
                  <td class="px-5 py-3 text-right font-mono text-xs text-stone-400">${r.returned}</td>
                  <td class="px-5 py-3 text-right font-mono text-xs ${r.active > 0 ? 'text-accent-soft' : 'text-stone-500'}">${r.active}</td>
                  <td class="px-5 py-3 text-right font-mono text-xs ${r.owed > 0 ? 'text-amber-300' : 'text-stone-500'}">${r.owed > 0 ? U.currency(r.owed) : '—'}</td>
                  <td class="px-5 py-3">${UI.statusBadge(r.status)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } else if (tab === 'sql') {
      const sql = this._sqlInput || 'SELECT b.title, b.author, COUNT(l.id) AS times_borrowed\nFROM books b\nLEFT JOIN loans l ON l.book_id = b.id\nGROUP BY b.id\nORDER BY times_borrowed DESC\nLIMIT 10;';
      const result = this._sqlResult;
      content = `
        <div class="mb-4">
          <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Run SQL against the live database</label>
          <textarea id="sqlConsole" rows="7" spellcheck="false"
            class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3.5 py-3 text-[13px] text-stone-100 font-mono outline-none resize-y">${U.esc(sql)}</textarea>
          <div class="flex items-center gap-2 mt-3">
            <button id="sqlRun" class="bg-white hover:bg-stone-200 text-black font-medium px-4 py-2 rounded-lg text-[13px] transition-colors">Run query</button>
            <span class="text-[11px] text-stone-500 font-mono">Tables: books, members, loans, reservations, categories</span>
          </div>
        </div>

        ${result ? `
          <div class="mt-4">
            ${result.error ? `
              <div class="surface border-red-500/30 rounded-lg p-4 text-red-300 text-xs font-mono">${U.esc(result.error)}</div>
            ` : result.sets.length === 0 ? `
              <div class="surface rounded-lg p-4 text-emerald-400 text-xs font-mono">Statement executed. No rows returned.</div>
            ` : result.sets.map(set => `
              <div class="surface rounded-lg overflow-hidden mt-3">
                <table class="w-full text-xs">
                  <thead class="font-mono uppercase tracking-wider text-stone-500 bg-white/[0.02]">
                    <tr class="border-b border-white/[0.06]">
                      ${set.columns.map(c => `<th class="text-left px-4 py-2.5 font-normal">${U.esc(c)}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${set.values.slice(0, 100).map(row => `
                      <tr class="border-b border-white/[0.04] last:border-0">
                        ${row.map(v => `<td class="px-4 py-2 text-stone-300 font-mono">${v === null ? '<span class="text-stone-600">NULL</span>' : U.esc(v)}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
                ${set.values.length > 100 ? `<div class="px-4 py-2 text-[11px] text-stone-500 border-t border-white/[0.06]">Showing first 100 of ${set.values.length} rows</div>` : ''}
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;
    }

    return `
      <div class="mb-8">
        <h1 class="text-2xl font-semibold tracking-tight">Reports</h1>
        <p class="text-sm text-stone-500 mt-1">Overdue, popular titles, member activity, and a live SQL console</p>
      </div>

      <div class="flex gap-1 mb-5 border-b border-white/[0.06] overflow-x-auto">
        ${this._reportTab('overdue', 'Overdue report', tab)}
        ${this._reportTab('popular', 'Most borrowed', tab)}
        ${this._reportTab('members', 'Member activity', tab)}
        ${this._reportTab('sql', 'SQL console', tab)}
      </div>

      ${content}
    `;
  },

  _reportTab(id, label, active) {
    return `<button data-report-tab="${id}" class="px-4 py-2.5 text-[13px] font-medium transition-colors border-b-2 whitespace-nowrap ${
      active === id ? 'text-stone-100 border-accent' : 'text-stone-500 border-transparent hover:text-stone-300'
    }">${U.esc(label)}</button>`;
  }
};

/* ========== ROUTER + APP ========== */
const App = {
  currentView: 'dashboard',

  render() {
    document.getElementById('nav').innerHTML = NAV.map(item => `
      <a href="#" data-view="${item.id}" class="nav-item flex items-center gap-3 px-5 py-2.5 text-[13px] text-stone-400 ${this.currentView === item.id ? 'active' : ''}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${item.icon}</svg>
        ${U.esc(item.label)}
      </a>
    `).join('');

    const user = Auth.current;
    if (user) {
      document.getElementById('userCard').innerHTML = `
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-[#8b7cff] flex items-center justify-center text-black font-semibold text-xs shrink-0">
            ${U.esc(user.name[0])}
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[12px] text-stone-200 font-medium truncate">${U.esc(user.name)}</div>
            <div class="text-[10px] text-stone-500 font-mono truncate">@${U.esc(user.username)}</div>
          </div>
        </div>
        <div class="mt-2.5 flex items-center justify-between">
          ${UI.roleBadge(user.role)}
          <button id="logoutBtn" class="text-[11px] text-stone-500 hover:text-stone-100 transition-colors">Sign out</button>
        </div>
      `;
    }

    const current = NAV.find(n => n.id === this.currentView);
    document.getElementById('breadcrumb').textContent = current ? current.label : '';

    const overdue = DB.one("SELECT COUNT(*) c FROM loans WHERE status = 'overdue'").c;
    document.getElementById('overdueIndicator').innerHTML = overdue > 0
      ? `<span class="text-red-400">${overdue} overdue</span>`
      : `<span class="text-emerald-400">all on time</span>`;

    const main = document.getElementById('main');
    main.innerHTML = Views[this.currentView] ? Views[this.currentView]() : UI.empty('Not found');

    this.bind();
  },

  navigate(view) {
    if (!Views[view]) return;
    this.currentView = view;
    this.render();
  },

  bind() {
    document.querySelectorAll('[data-view]').forEach(el => {
      el.addEventListener('click', e => { e.preventDefault(); this.navigate(el.dataset.view); });
    });

    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      Auth.logout();
      document.getElementById('app').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginScreen').classList.add('flex');
    });

    document.getElementById('resetDbBtn')?.addEventListener('click', () => {
      if (!Auth.can('db.reset')) { UI.toast('Only administrators can reset the database', 'error'); return; }
      UI.confirm('Reset the database? All loans, members, and books will be restored to seed data.', () => {
        DB.reset().then(() => {
          Library.refreshOverdueStatus();
          UI.toast('Database reset', 'success');
          this.render();
        });
      }, { title: 'Confirm reset', confirmLabel: 'Reset', danger: true });
    });

    document.querySelectorAll('[data-quick]').forEach(el => {
      el.addEventListener('click', () => this.navigate('circulation'));
    });

    document.getElementById('issueForm')?.addEventListener('submit', e => {
      e.preventDefault();
      const bookId = parseInt(e.target.book.value, 10);
      const memberId = parseInt(e.target.member.value, 10);
      if (!bookId || !memberId) { UI.toast('Select both a book and a member', 'error'); return; }
      try {
        const { dueDate } = Library.issue(bookId, memberId);
        UI.toast(`Book issued · due ${dueDate}`, 'success');
        this.render();
      } catch (err) {
        UI.toast(err.message, 'error');
      }
    });

    document.querySelectorAll('[data-return]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.return, 10);
        try {
          const { overdueDays, fine } = Library.returnBook(id);
          if (fine > 0) UI.toast(`Returned — ${overdueDays}d overdue, fine ${U.currency(fine)}`, 'warn');
          else UI.toast('Book returned — no fine', 'success');
          this.render();
        } catch (err) {
          UI.toast(err.message, 'error');
        }
      });
    });

    document.querySelectorAll('[data-renew]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.renew, 10);
        try {
          const { newDue } = Library.renew(id);
          UI.toast(`Renewed — new due date ${newDue}`, 'success');
          this.render();
        } catch (err) {
          UI.toast(err.message, 'error');
        }
      });
    });

    document.querySelectorAll('[data-pay-fine]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.payFine, 10);
        UI.confirm('Mark this fine as paid?', () => {
          Library.payFine(id);
          UI.toast('Fine marked as paid', 'success');
          this.render();
        }, { title: 'Confirm payment', confirmLabel: 'Mark paid', danger: false });
      });
    });

    document.querySelectorAll('[data-cancel-res]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.cancelRes, 10);
        UI.confirm('Cancel this reservation?', () => {
          Library.cancelReservation(id);
          UI.toast('Reservation cancelled', 'success');
          this.render();
        }, { title: 'Cancel reservation', confirmLabel: 'Cancel reservation', danger: true });
      });
    });

    document.getElementById('newBookBtn')?.addEventListener('click', () => this.bookForm());
    document.querySelectorAll('[data-edit-book]').forEach(el => {
      el.addEventListener('click', () => this.bookForm(parseInt(el.dataset.editBook, 10)));
    });
    document.querySelectorAll('[data-del-book]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.delBook, 10);
        const b = DB.one('SELECT * FROM books WHERE id = ?', [id]);
        UI.confirm(`Delete "${b.title}" from the catalog?`, () => {
          DB.run('DELETE FROM books WHERE id = ?', [id]);
          UI.toast('Book deleted', 'success');
          this.render();
        });
      });
    });

    document.getElementById('newMemberBtn')?.addEventListener('click', () => this.memberForm());
    document.querySelectorAll('[data-edit-member]').forEach(el => {
      el.addEventListener('click', () => this.memberForm(parseInt(el.dataset.editMember, 10)));
    });
    document.querySelectorAll('[data-del-member]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.delMember, 10);
        const m = DB.one('SELECT * FROM members WHERE id = ?', [id]);
        UI.confirm(`Delete member ${m.first_name} ${m.last_name}?`, () => {
          DB.run('DELETE FROM members WHERE id = ?', [id]);
          UI.toast('Member deleted', 'success');
          this.render();
        });
      });
    });

    document.getElementById('catSearch')?.addEventListener('input', e => {
      Views._catSearch = e.target.value;
      clearTimeout(this._catTimer);
      this._catTimer = setTimeout(() => this.render(), 200);
    });
    document.getElementById('catCategory')?.addEventListener('change', e => {
      Views._catCategory = e.target.value;
      this.render();
    });

    document.querySelectorAll('[data-loan-filter]').forEach(el => {
      el.addEventListener('click', () => {
        Views._loanFilter = el.dataset.loanFilter;
        this.render();
      });
    });

    document.querySelectorAll('[data-report-tab]').forEach(el => {
      el.addEventListener('click', () => {
        Views._reportsTab = el.dataset.reportTab;
        this.render();
      });
    });

    document.getElementById('sqlRun')?.addEventListener('click', () => {
      const sql = document.getElementById('sqlConsole').value.trim();
      if (!sql) return;
      Views._sqlInput = sql;
      try {
        const sets = DB.exec(sql);
        Views._sqlResult = { sets: sets.map(s => ({ columns: s.columns, values: s.values })), error: null };
        if (sets.length === 0) UI.toast('Executed — no rows', 'success');
        else UI.toast(`Returned ${sets[0].values.length} row${sets[0].values.length === 1 ? '' : 's'}`, 'success');
      } catch (err) {
        Views._sqlResult = { sets: [], error: err.message };
        UI.toast('SQL error', 'error');
      }
      this.render();
    });
  },

  bookForm(id) {
    const editing = id !== undefined;
    const b = editing ? DB.one('SELECT * FROM books WHERE id = ?', [id]) : null;
    const cats = DB.all('SELECT * FROM categories ORDER BY name');

    UI.modal({
      title: editing ? 'Edit book' : 'Add book',
      body: `
        <form id="bookForm" class="space-y-4">
          <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">ISBN</label>
              <input name="isbn" required value="${U.esc(b?.isbn || '')}" placeholder="978-…"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Year</label>
              <input name="year" type="number" min="1500" max="2100" value="${b?.published_year || new Date().getFullYear()}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none font-mono">
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Title</label>
            <input name="title" required value="${U.esc(b?.title || '')}"
              class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Author</label>
              <input name="author" required value="${U.esc(b?.author || '')}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Publisher</label>
              <input name="publisher" value="${U.esc(b?.publisher || '')}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Category</label>
              <select name="category_id" required class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
                ${cats.map(c => `<option value="${c.id}" ${b?.category_id === c.id ? 'selected' : ''}>${U.esc(c.name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Copies</label>
              <input name="total" type="number" min="0" required value="${b?.total_copies ?? 1}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Shelf</label>
              <input name="shelf" value="${U.esc(b?.shelf || '')}" placeholder="A-01"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none font-mono">
            </div>
          </div>
        </form>
      `,
      footer: `
        <button data-close class="px-4 py-2 text-sm text-stone-300 hover:text-white transition-colors">Cancel</button>
        <button id="bookSave" class="px-4 py-2 text-sm font-medium bg-white hover:bg-stone-200 text-black rounded-lg transition-colors">${editing ? 'Save changes' : 'Add book'}</button>
      `,
      onMount(root) {
        root.querySelector('#bookSave').addEventListener('click', () => {
          const fd = new FormData(root.querySelector('#bookForm'));
          const data = Object.fromEntries(fd);
          try {
            if (editing) {
              DB.run(
                `UPDATE books SET isbn=?, title=?, author=?, category_id=?, publisher=?, published_year=?, total_copies=?, shelf=? WHERE id=?`,
                [data.isbn, data.title, data.author, parseInt(data.category_id, 10), data.publisher, parseInt(data.year, 10) || null, parseInt(data.total, 10), data.shelf, id]
              );
              DB.run(`UPDATE books SET available_copies = MIN(available_copies, total_copies) WHERE id = ?`, [id]);
              UI.toast('Book updated', 'success');
            } else {
              DB.run(
                `INSERT INTO books (isbn, title, author, category_id, publisher, published_year, total_copies, available_copies, shelf) VALUES (?,?,?,?,?,?,?,?,?)`,
                [data.isbn, data.title, data.author, parseInt(data.category_id, 10), data.publisher, parseInt(data.year, 10) || null, parseInt(data.total, 10), parseInt(data.total, 10), data.shelf]
              );
              UI.toast('Book added', 'success');
            }
            UI.closeModal();
            App.render();
          } catch (err) {
            UI.toast(err.message.includes('UNIQUE') ? 'ISBN already exists' : err.message, 'error');
          }
        });
      }
    });
  },

  memberForm(id) {
    const editing = id !== undefined;
    const m = editing ? DB.one('SELECT * FROM members WHERE id = ?', [id]) : null;

    UI.modal({
      title: editing ? 'Edit member' : 'Register member',
      body: `
        <form id="memberForm" class="space-y-4">
          <div>
            <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Member ID</label>
            <input name="member_id" required value="${U.esc(m?.member_id || 'MEM-' + (1000 + DB.one('SELECT COUNT(*) c FROM members').c + 1))}"
              class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none font-mono">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">First name</label>
              <input name="first_name" required value="${U.esc(m?.first_name || '')}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Last name</label>
              <input name="last_name" required value="${U.esc(m?.last_name || '')}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Email</label>
            <input name="email" type="email" required value="${U.esc(m?.email || '')}"
              class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Phone</label>
              <input name="phone" value="${U.esc(m?.phone || '')}"
                class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-mono uppercase tracking-widest text-stone-500 mb-2">Status</label>
              <select name="status" class="w-full bg-white/[0.02] border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-stone-100 outline-none">
                ${['active','suspended','expired'].map(s => `<option value="${s}" ${m?.status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        </form>
      `,
      footer: `
        <button data-close class="px-4 py-2 text-sm text-stone-300 hover:text-white transition-colors">Cancel</button>
        <button id="memberSave" class="px-4 py-2 text-sm font-medium bg-white hover:bg-stone-200 text-black rounded-lg transition-colors">${editing ? 'Save' : 'Register'}</button>
      `,
      onMount(root) {
        root.querySelector('#memberSave').addEventListener('click', () => {
          const fd = new FormData(root.querySelector('#memberForm'));
          const data = Object.fromEntries(fd);
          try {
            if (editing) {
              DB.run(
                `UPDATE members SET member_id=?, first_name=?, last_name=?, email=?, phone=?, status=? WHERE id=?`,
                [data.member_id, data.first_name, data.last_name, data.email, data.phone, data.status, id]
              );
              UI.toast('Member updated', 'success');
            } else {
              DB.run(
                `INSERT INTO members (member_id, first_name, last_name, email, phone, join_date, status) VALUES (?,?,?,?,?,?,?)`,
                [data.member_id, data.first_name, data.last_name, data.email, data.phone, U.today(), 'active']
              );
              UI.toast('Member registered', 'success');
            }
            UI.closeModal();
            App.render();
          } catch (err) {
            UI.toast(err.message.includes('UNIQUE') ? 'Member ID or email already exists' : err.message, 'error');
          }
        });
      }
    });
  }
};

/* ========== BOOT ========== */
(async function boot() {
  try {
    await DB.init();
    Library.refreshOverdueStatus();

    document.querySelectorAll('[data-fill]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [u, p] = btn.dataset.fill.split(':');
        document.getElementById('loginUser').value = u;
        document.getElementById('loginPass').value = p;
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      const res = await Auth.login(user, pass);
      if (!res.ok) {
        errEl.textContent = res.error;
        errEl.classList.remove('hidden');
        return;
      }
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('flex');
      document.getElementById('app').classList.remove('hidden');
      App.render();
      UI.toast(`Signed in as ${Auth.current.name}`, 'success');
    });

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginScreen').classList.add('flex');

  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML = `
      <div class="text-center max-w-md">
        <div class="text-red-400 text-sm font-mono">Failed to initialize</div>
        <div class="text-xs text-stone-500 mt-2">${U.esc(err.message)}</div>
      </div>
    `;
  }
})();
</script>
