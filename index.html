<script>
/* ============================================================================
   LMS — Library Management System
   Real SQL (SQLite via SQL.js) with triggers, date arithmetic, and transactions.
   ============================================================================ */

/* ========== UTILITIES ========== */
const U = {
  esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  },
  today() { return new Date().toISOString().slice(0, 10); },
  addDays(dateStr, n) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  },
  daysBetween(a, b) {
    const d1 = new Date(a), d2 = new Date(b);
    return Math.floor((d2 - d1) / 86400000);
  },
  time(ts) {
    const d = new Date(ts);
    const now = Date.now();
    const diff = Math.floor((now - ts) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toISOString().slice(0, 10);
  },
  date(s) { return s ? new Date(s).toISOString().slice(0, 10) : '—'; },
  currency(n) { return (Math.round(n * 100) / 100).toFixed(2) + ' ETB'; },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
};

/* ========== CONSTANTS ========== */
const RULES = {
  LOAN_DAYS: 14,
  FINE_PER_DAY: 5,
  MAX_LOANS_PER_MEMBER: 3,
  SUSPEND_FINE_THRESHOLD: 200,
  SUSPEND_OVERDUE_COUNT: 2
};

/* ========== DB LAYER ========== */
const DB = {
  sql: null,
  db: null,
  KEY: 'lms_db_v1',

  async init() {
    this.sql = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });
    const saved = localStorage.getItem(this.KEY);
    if (saved) {
      try {
        this.db = new this.sql.Database(Uint8Array.from(JSON.parse(saved)));
        // Verify DB is intact AND has users
        const userCount = this.db.exec('SELECT COUNT(*) FROM users')[0].values[0][0];
        if (userCount > 0) return;
        console.warn('Saved DB has no users — reseeding.');
        localStorage.removeItem(this.KEY);
      } catch (e) {
        console.warn('Reseeding DB:', e);
        localStorage.removeItem(this.KEY);
      }
    }
    this.db = new this.sql.Database();
    await this.seed();
    this.save();

  async seed() {
    this.db.run(`
      PRAGMA foreign_keys = ON;

      CREATE TABLE categories (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        code TEXT UNIQUE NOT NULL,
        name TEXT NOT NULL
      );

      CREATE TABLE books (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        isbn TEXT UNIQUE NOT NULL,
        title TEXT NOT NULL,
        author TEXT NOT NULL,
        category_id INTEGER NOT NULL,
        publisher TEXT,
        published_year INTEGER,
        total_copies INTEGER NOT NULL CHECK (total_copies >= 0),
        available_copies INTEGER NOT NULL CHECK (available_copies >= 0),
        shelf TEXT,
        FOREIGN KEY (category_id) REFERENCES categories(id)
      );

      CREATE TABLE members (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        member_id TEXT UNIQUE NOT NULL,
        first_name TEXT NOT NULL,
        last_name TEXT NOT NULL,
        email TEXT UNIQUE NOT NULL,
        phone TEXT,
        join_date TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','suspended','expired')),
        notes TEXT
      );

      CREATE TABLE loans (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        book_id INTEGER NOT NULL,
        member_id INTEGER NOT NULL,
        loan_date TEXT NOT NULL,
        due_date TEXT NOT NULL,
        return_date TEXT,
        status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','returned','overdue','lost')),
        fine_amount REAL NOT NULL DEFAULT 0,
        fine_paid INTEGER NOT NULL DEFAULT 0,
        FOREIGN KEY (book_id) REFERENCES books(id),
        FOREIGN KEY (member_id) REFERENCES members(id)
      );

      CREATE TABLE reservations (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        book_id INTEGER NOT NULL,
        member_id INTEGER NOT NULL,
        reserved_at TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending','fulfilled','cancelled')),
        FOREIGN KEY (book_id) REFERENCES books(id),
        FOREIGN KEY (member_id) REFERENCES members(id)
      );

      CREATE TABLE users (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        username TEXT UNIQUE NOT NULL,
        password_hash TEXT NOT NULL,
        role TEXT NOT NULL CHECK (role IN ('admin','librarian','viewer')),
        display_name TEXT NOT NULL
      );

      CREATE INDEX idx_books_category ON books(category_id);
      CREATE INDEX idx_loans_book ON loans(book_id);
      CREATE INDEX idx_loans_member ON loans(member_id);
      CREATE INDEX idx_loans_status ON loans(status);
      CREATE INDEX idx_res_book ON reservations(book_id);

      CREATE TRIGGER trg_loan_insert AFTER INSERT ON loans
      WHEN NEW.status = 'active'

        UPDATE books SET available_copies = available_copies - 1
        WHERE id = NEW.book_id;
      END;

      CREATE TRIGGER trg_loan_return AFTER UPDATE OF status ON loans
      WHEN OLD.status != 'returned' AND NEW.status = 'returned'

        UPDATE books SET available_copies = available_copies + 1
        WHERE id = NEW.book_id;

      [3, 1, d(-3), d(11), 'active', null],
      [11, 2, d(-20), d(-6), 'active', null],
      [4, 3, d(-8), d(6), 'active', null],
      [8, 4, d(-12), d(2), 'active', null],
      [14, 5, d(-25), d(-11), 'active', null],
      [22, 6, d(-7), d(7), 'active', null],
      [26, 7, d(-2), d(12), 'active', null],
      [31, 8, d(-30), d(-16), 'active', null],
      [36, 9, d(-10), d(4), 'active', null],
      [40, 10, d(-15), d(-1), 'active', null],
      [2, 11, d(-45), d(-31), 'returned', d(-25)],
      [12, 12, d(-30), d(-16), 'returned', d(-14)],
      [18, 13, d(-20), d(-6), 'returned', d(-8)],
      [28, 14, d(-40), d(-26), 'returned', d(-26)],
    ];
    loans.forEach(l => {
      let fine = 0;
      if (l[4] === 'returned' && l[5]) {
        const overdueDays = Math.max(0, U.daysBetween(l[3], l[5]));
        fine = overdueDays * RULES.FINE_PER_DAY;
      }
      this.db.run(
        'INSERT INTO loans (book_id, member_id, loan_date, due_date, return_date, status, fine_amount, fine_paid) VALUES (?,?,?,?,?,?,?,?)',
        [l[0], l[1], l[2], l[3], l[5], l[4], fine, l[4] === 'returned' ? 1 : 0]
      );
    });

    // Reservations
    const res = [
      [3, 5, d(-2), 'pending'],
      [3, 7, d(-1), 'pending'],
      [11, 9, d(-3), 'pending'],
      [26, 12, d(-1), 'pending'],
    ];
    res.forEach(r => this.db.run(
      'INSERT INTO reservations (book_id, member_id, reserved_at, status) VALUES (?,?,?,?)',
      r
    ));

    // Sync available_copies
    this.db.run(`
      UPDATE books SET available_copies = total_copies - (
        SELECT COUNT(*) FROM loans WHERE loans.book_id = books.id AND loans.status IN ('active','overdue')
      )
    `);

    // Users — awaited sequentially so they exist before save()
    const users = [
      ['admin', 'admin', 'admin123', 'admin', 'Administrator'],
      ['librarian', 'librarian', 'lib123', 'librarian', 'Circulation Desk'],
      ['viewer', 'viewer', 'view123', 'viewer', 'Read-only Guest']
    ];
    for (const u of users) {
      const hash = await Auth.hash(u[2], u[0]);
      this.db.run('INSERT INTO users (username, password_hash, role, display_name) VALUES (?,?,?,?)',
        [u[0], hash, u[3], u[4]]);
    }
  },

  all(sql, params = []) {
    const stmt = this.db.prepare(sql);
    stmt.bind(params);
    const rows = [];
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    return rows;
  },
  one(sql, params = []) { return this.all(sql, params)[0] || null; },
  run(sql, params = []) { this.db.run(sql, params); this.save(); },

  tx(fn) {
    this.db.run('BEGIN');
    try {
      const result = fn();
      this.db.run('COMMIT');
      this.save();
      return result;
    } catch (e) {
      this.db.run('ROLLBACK');
      throw e;
    }
  },

  save() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(Array.from(this.db.export())));
    } catch (e) {
      UI.toast('Storage full — reset the database', 'error');
    }
  },

  reset() {
    localStorage.removeItem(this.KEY);
    this.db = new this.sql.Database();
    return this.seed().then(() => this.save());
  },

  exec(sql) { return this.db.exec(sql); }
};

/* ========== AUTH ========== */
const Auth = {
  current: null,
  async hash(password, salt) {
    const data = new TextEncoder().encode(salt + '::' + password);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  async login(username, password) {
    const user = DB.one('SELECT * FROM users WHERE username = ?', [username]);
    if (!user) return { ok: false, error: 'User not found' };
    const hash = await this.hash(password, username);
    if (hash !== user.password_hash) return { ok: false, error: 'Incorrect password' };
    this.current = { id: user.id, username: user.username, role: user.role, name: user.display_name };
    return { ok: true };
  },
  logout() { this.current = null; },
  can(action) {
    if (!this.current) return false;
    const perms = {
      'books.create':    ['admin', 'librarian'],
      'books.edit':      ['admin', 'librarian'],
      'books.delete':    ['admin'],
      'members.create':  ['admin', 'librarian'],
      'members.edit':    ['admin', 'librarian'],
      'members.delete':  ['admin'],
      'loans.issue':     ['admin', 'librarian'],
      'loans.return':    ['admin', 'librarian'],
      'loans.renew':     ['admin', 'librarian'],
      'fines.pay':       ['admin', 'librarian'],
      'reservations.create': ['admin', 'librarian'],
      'reservations.cancel': ['admin', 'librarian'],
      'db.reset':        ['admin']
    };
    return (perms[action] || []).includes(this.current.role);
  }
};

/* ========== LIBRARY BUSINESS LOGIC ========== */
const Library = {
  getBookState(bookId) {
    return DB.one(`
      SELECT b.*, c.name AS category_name,
        (SELECT COUNT(*) FROM loans WHERE book_id = b.id AND status IN ('active','overdue')) AS on_loan,
        (SELECT COUNT(*) FROM reservations WHERE book_id = b.id AND status = 'pending') AS reserved
      FROM books b
      JOIN categories c ON b.category_id = c.id
      WHERE b.id = ?`, [bookId]);
  },

  getMemberState(memberId) {
    return DB.one(`
      SELECT m.*,
        (SELECT COUNT(*) FROM loans WHERE member_id = m.id AND status IN ('active','overdue')) AS active_loans,
        (SELECT COUNT(*) FROM loans WHERE member_id = m.id AND status = 'overdue') AS overdue_loans,
        (SELECT COALESCE(SUM(fine_amount),0) FROM loans WHERE member_id = m.id AND fine_paid = 0) AS unpaid_fines
      FROM members m
      WHERE m.id = ?`, [memberId]);
  },

  issue(bookId, memberId, days = RULES.LOAN_DAYS) {
    const book = this.getBookState(bookId);
    const member = this.getMemberState(memberId);

    if (!book || !member) throw new Error('Book or member not found');
    if (member.status === 'suspended') throw new Error('Member is suspended');
    if (member.status === 'expired') throw new Error('Membership expired');
    if (member.active_loans >= RULES.MAX_LOANS_PER_MEMBER)
      throw new Error(`Loan limit reached (${RULES.MAX_LOANS_PER_MEMBER} books)`);
    if (book.available_copies < 1) throw new Error('No copies available');
    if (member.unpaid_fines >= RULES.SUSPEND_FINE_THRESHOLD)
      throw new Error(`Unpaid fines (${U.currency(member.unpaid_fines)}) exceed threshold`);

    const loanDate = U.today();
    const dueDate = U.addDays(loanDate, days);

    return DB.tx(() => {
      DB.db.run(
        'INSERT INTO loans (book_id, member_id, loan_date, due_date, status) VALUES (?,?,?,?,?)',
        [bookId, memberId, loanDate, dueDate, 'active']
      );
      return { loanDate, dueDate };
    });
  },

  returnBook(loanId) {
    const loan = DB.one(`
      SELECT l.*, b.title, b.id AS book_id, m.first_name, m.last_name
      FROM loans l
      JOIN books b ON l.book_id = b.id
      JOIN members m ON l.member_id = m.id
      WHERE l.id = ?`, [loanId]);
    if (!loan) throw new Error('Loan not found');
    if (loan.status === 'returned') throw new Error('Already returned');

    const returnDate = U.today();
    const overdueDays = Math.max(0, U.daysBetween(loan.due_date, returnDate));
    const fine = overdueDays * RULES.FINE_PER_DAY;

    return DB.tx(() => {
      DB.db.run(
        'UPDATE loans SET return_date = ?, status = ?, fine_amount = ? WHERE id = ?',
        [returnDate, 'returned', fine, loanId]
      );
      this._recheckMemberStatus(loan.member_id);
      return { returnDate, overdueDays, fine };
    });
  },

  renew(loanId, extraDays = RULES.LOAN_DAYS) {
    const loan = DB.one('SELECT * FROM loans WHERE id = ?', [loanId]);
    if (!loan) throw new Error('Loan not found');
    if (loan.status !== 'active') throw new Error('Only active loans can be renewed');

    const overdueDays = Math.max(0, U.daysBetween(loan.due_date, U.today()));
    if (overdueDays > 0) throw new Error('Overdue loans cannot be renewed');

    const reservations = DB.one(
      "SELECT COUNT(*) c FROM reservations WHERE book_id = ? AND status = 'pending'",
      [loan.book_id]
    );
    if (reservations.c > 0) throw new Error('Cannot renew — book is reserved by another member');

    const newDue = U.addDays(loan.due_date, extraDays);
    DB.run('UPDATE loans SET due_date = ? WHERE id = ?', [newDue, loanId]);
    return { newDue };
  },

  payFine(loanId) {
    DB.run('UPDATE loans SET fine_paid = 1 WHERE id = ?', [loanId]);
    const loan = DB.one('SELECT member_id FROM loans WHERE id = ?', [loanId]);
    if (loan) this._recheckMemberStatus(loan.member_id);
  },

  reserve(bookId, memberId) {
    const existing = DB.one(
      "SELECT id FROM reservations WHERE book_id = ? AND member_id = ? AND status = 'pending'",
      [bookId, memberId]
    );
    if (existing) throw new Error('Already reserved by this member');

    const book = this.getBookState(bookId);
    if (!book) throw new Error('Book not found');

    if (book.available_copies > 0 && book.reserved === 0) {
      throw new Error('Copies are available — issue the book directly');
    }

    DB.run(
      "INSERT INTO reservations (book_id, member_id, reserved_at, status) VALUES (?,?,?,'pending')",
      [bookId, memberId, U.today()]
    );
  },

  cancelReservation(id) {
    DB.run("UPDATE reservations SET status = 'cancelled' WHERE id = ?", [id]);
  },

  _recheckMemberStatus(memberId) {
    const state = this.getMemberState(memberId);
    if (!state) return;
    if (state.status === 'expired') return;

    const shouldSuspend =
      state.overdue_loans >= RULES.SUSPEND_OVERDUE_COUNT ||
      state.unpaid_fines >= RULES.SUSPEND_FINE_THRESHOLD;

    if (shouldSuspend && state.status !== 'suspended') {
      DB.db.run("UPDATE members SET status = 'suspended' WHERE id = ?", [memberId]);
    } else if (!shouldSuspend && state.status === 'suspended') {
      DB.db.run("UPDATE members SET status = 'active' WHERE id = ?", [memberId]);
    }
  },

  refreshOverdueStatus() {
    const today = U.today();
    DB.run(`
      UPDATE loans SET status = 'overdue'
      WHERE status = 'active' AND due_date < ?
    `, [today]);

    DB.all('SELECT id FROM members').forEach(m => this._recheckMemberStatus(m.id));
  }
};

/* ========== UI HELPERS ========== */
const UI = {
  toast(message, type = 'info') {
    const colors = {
      info:    'border-white/10 text-stone-200',
      success: 'border-emerald-500/30 text-emerald-300',
      error:   'border-red-500/30 text-red-300',
      warn:    'border-amber-500/30 text-amber-300'
    };
    const el = document.createElement('div');
    el.className = 'toast surface rounded-lg px-4 py-3 text-sm max-w-xs shadow-xl border ' + colors[type];
    el.textContent = message;
    document.getElementById('toastRoot').appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(() => el.remove(), 300);
    }, 3400);
  },

  modal({ title, body, footer, onMount, wide }) {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-panel surface rounded-2xl w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[88vh] overflow-y-auto">
        <div class="flex items-center justify-between p-5 border-b border-white/[0.06]">
          <h2 class="text-base font-medium">${U.esc(title)}</h2>
          <button data-close aria-label="Close" class="w-8 h-8 rounded-md text-stone-500 hover:text-stone-100 hover:bg-white/[0.05] flex items-center justify-center transition-colors">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="p-5">${body}</div>
        ${footer ? `<div class="p-5 border-t border-white/[0.06] flex justify-end gap-2">${footer}</div>` : ''}
      </div>
    `;
    root.classList.remove('hidden');
    root.classList.add('flex');
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', UI.closeModal));
    root.addEventListener('mousedown', e => { if (e.target === root) UI.closeModal(); });
    if (onMount) onMount(root);
  },

  closeModal() {
    const root = document.getElementById('modalRoot');
    root.classList.add('hidden');
    root.classList.remove('flex');
    root.innerHTML = '';
  },

  confirm(message, onConfirm, opts = {}) {
    const danger = opts.danger !== false;
    UI.modal({
      title: opts.title || 'Confirm action',
      body: `<p class="text-sm text-stone-300">${U.esc(message)}</p>`,
      footer: `
        <button data-close class="px-4 py-2 text-sm text-stone-300 hover:text-white transition-colors">Cancel</button>
        <button id="confirmYes" class="px-4 py-2 text-sm font-medium ${danger ? 'bg-red-500 hover:bg-red-400' : 'bg-white hover:bg-stone-200 text-black'} text-white rounded-lg transition-colors">
          ${U.esc(opts.confirmLabel || 'Delete')}
        </button>
      `,
      onMount(root) {
        root.querySelector('#confirmYes').addEventListener('click', () => {
          UI.closeModal();
          onConfirm();
        });
      }
    });
  },

  empty(title, hint) {
    return `
      <div class="text-center py-16 px-6">
        <div class="w-12 h-12 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-center mx-auto mb-4">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="text-stone-600">
            <circle cx="11" cy="11" r="7"/><path d="M4 20l6-6"/>
          </svg>
        </div>
        <h3 class="text-sm text-stone-300 font-medium">${U.esc(title)}</h3>
        ${hint ? `<p class="text-xs text-stone-500 mt-1.5 max-w-sm mx-auto">${U.esc(hint)}</p>` : ''}
      </div>
    `;
  },

  statusBadge(status) {
    const map = {
      active:    'bg-emerald-500/10 text-emerald-300',
      overdue:   'bg-red-500/10 text-red-300',
      returned:  'bg-white/[0.04] text-stone-400',
      suspended: 'bg-amber-500/10 text-amber-300',
      expired:   'bg-white/[0.04] text-stone-500',
      pending:   'bg-accent/10 text-accent-soft',
      fulfilled: 'bg-emerald-500/10 text-emerald-300',
      cancelled: 'bg-white/[0.04] text-stone-500',
      lost:      'bg-red-500/10 text-red-300'
    };
    return `<span class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded ${map[status] || 'bg-white/[0.04] text-stone-400'}">${status}</span>`;
  },

  roleBadge(role) {
    const map = {
      admin:     'bg-amber-500/10 text-amber-300 border-amber-500/30',
      librarian: 'bg-accent/10 text-accent-soft border-accent/30',
      viewer:    'bg-white/[0.04] text-stone-400 border-white/[0.10]'
    };
    return `<span class="text-[10px] font-mono uppercase tracking-widest px-2 py-0.5 rounded border ${map[role]}">${role}</span>`;
  }
};
